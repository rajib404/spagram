services:
  app:
    build: .
    container_name: sparina-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env.production
    depends_on:
      sparina-db:
        condition: service_healthy
    volumes:
      - sparina-uploads:/app/uploads
    networks:
      - sparina-internal
      - sparina-external

  sparina-db:
    image: postgres:16-alpine
    container_name: sparina-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spagram
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: spagram
    volumes:
      - spagram-pgdata:/var/lib/postgresql/data
    networks:
      - sparina-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spagram -d spagram"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off migration runner — uses builder stage which has all Prisma engines pre-downloaded
  migrate:
    build:
      context: .
      target: builder
    container_name: sparina-migrate
    environment:
      DATABASE_URL: "postgresql://spagram:${DB_PASSWORD}@sparina-db:5432/spagram?schema=public"
    command: npx prisma migrate deploy
    depends_on:
      sparina-db:
        condition: service_healthy
    networks:
      - sparina-internal
    profiles:
      - tools

  # One-off seed runner
  seed:
    build:
      context: .
      target: builder
    container_name: sparina-seed
    environment:
      DATABASE_URL: "postgresql://spagram:${DB_PASSWORD}@sparina-db:5432/spagram?schema=public"
    command: npx prisma db seed
    depends_on:
      sparina-db:
        condition: service_healthy
    networks:
      - sparina-internal
    profiles:
      - tools

volumes:
  spagram-pgdata:
    driver: local
  sparina-uploads:
    driver: local

networks:
  sparina-internal:
    driver: bridge
    internal: true
  sparina-external:
    driver: bridge
